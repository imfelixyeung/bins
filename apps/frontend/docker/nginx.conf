# nginx serves the static export, so it only has to reproduce what the Next server
# used to do for a `output: "export"` build: map a route onto the .html file the
# export wrote for it, and serve a real 404 page for routes that do not exist.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types has no entry for .webmanifest, so it falls through
    # to this and is served as JSON. It is set per location rather than through a
    # types block, which would replace the inherited mapping for everything else.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Next writes one .html per route at the route's own path, so /status is
    # status.html and /docs/api is docs/api.html. The directories beside them hold
    # only the RSC payload .txt files, which is why $uri/index.html is a fallback
    # rather than the rule.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The export writes status.html rather than status/index.html, so a request for
    # /status/ is retried without the slash. Without this nginx would find the
    # directory, find no index in it, and answer 403.
    location ~ ^/(.+)/$ {
        rewrite ^/(.+)/$ /$1 last;
    }

    # Content-hashed filenames, so they can be held onto for as long as browsers
    # like. This is what makes the deploys cheap rather than the HTML cache.
    # Only add_header is used rather than `expires`, which emits a second
    # Cache-Control header rather than adding `immutable` to one.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker has to be revalidated or a broken one sticks around after
    # it is fixed, which is the one caching mistake that outlives a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # HTML is revalidated on every visit, so a deploy is picked up on the next page
    # load. It is also what error_page falls back to, so it is served internally
    # rather than fetched over HTTP.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}