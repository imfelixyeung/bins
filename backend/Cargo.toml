[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9" }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate", "chrono"] }
clap = { version = "4.6.7", features = ["derive"] }
tokio-util = { version = "0.7.19", features = ["io"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
anyhow = "1.0.104"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls", "http2", "charset", "json"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
csv = "1.4.0"
icalendar = "0.17.14"
rmcp = { version = "3.5.0", features = ["transport-streamable-http-server"] }
serde_json = "1.0.151"
schemars = "1.2.2"
