version: "3.7"

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "psql", "-U", "postgres", "-c", "select 1"]
      interval: 5s
      timeout: 30s
      retries: 15
      start_period: 5s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - db-data:/var/lib/postgresql/18/docker

  worker:
    image: registry.digitalocean.com/felixyeung/bins:worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/db
    depends_on:
      - db

  web:
    image: registry.digitalocean.com/felixyeung/bins:web
    restart: unless-stopped
    labels:
      # rapidapi requests can skip rate limiting, next.js middleware will check if the secret is valid
      - "traefik.http.routers.bins-rapid.rule=HostRegexp(`.*`) && PathPrefix(`/api`) && HeaderRegexp(`X-RapidAPI-Proxy-Secret`, `.+`)"
      - "traefik.http.routers.bins-rapid.priority=20"
      # - "traefik.http.routers.bins-rapid.entrypoints=web"
      # - "traefik.http.routers.bins-rapid.service=bins-service"

      # normal user rate limiting
      - "traefik.http.routers.bins.rule=HostRegexp(`.*`)"
      - "traefik.http.routers.bins.priority=10"
      # - "traefik.http.routers.bins.entrypoints=web"
      # - "traefik.http.routers.bins.service=bins-service"
      - "traefik.http.routers.bins.middlewares=bins-ratelimit"

      # rate limit trpc random premises api, cache 1sec
      - "traefik.http.routers.bins-api-trpc.rule=HostRegexp(`.*`) && PathPrefix(`/api/trpc/premises.random`)"
      - "traefik.http.routers.bins-api-trpc.priority=16"
      - "traefik.http.routers.bins-api-trpc.middlewares=bins-ratelimit,bins-api-cache-1s"

      # rate limit api and add cors/caching headers
      - "traefik.http.routers.bins-api.rule=HostRegexp(`.*`) && PathPrefix(`/api`)"
      - "traefik.http.routers.bins-api.priority=15"
      - "traefik.http.routers.bins-api.middlewares=bins-ratelimit,bins-api-cors,bins-api-cache"

    secrets:
      - rapid_api_proxy_secret
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/db
      - RAPID_API_PROXY_SECRET_FILE=/run/secrets/rapid_api_proxy_secret
      - SKIP_SITEMAP=
    depends_on:
      - db

  tunnel:
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    secrets:
      - tunnel_token
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel_token

  migration:
    image: registry.digitalocean.com/felixyeung/bins:migration
    restart: "no"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/db
    depends_on:
      - db
    deploy:
      restart_policy:
        condition: none

  proxy:
    image: traefik:v3.7.12
    command:
      - "--ping=true"
      - "--api.insecure=true"
      - "--providers.docker"
      - "--log.level=INFO"
    labels:
      - "traefik.http.middlewares.bins-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.bins-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.bins-ratelimit.ratelimit.period=10s"
      - "traefik.http.middlewares.bins-api-cors.headers.customresponseheaders.access-control-allow-origin=*"
      - "traefik.http.middlewares.bins-api-cache.headers.customresponseheaders.cache-control=public,max-age=60"
      - "traefik.http.middlewares.bins-api-cache-1s.headers.customresponseheaders.cache-control=public,max-age=1"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 30s
      retries: 15
      start_period: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  rewrite-db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - rewrite-db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 30s
      retries: 15
      start_period: 10s

  rewrite-backend:
    build:
      context: ./backend
      target: runtime
    image: bins-backend:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@rewrite-db:5432/db
      PORT: "3000"
      RUST_LOG: backend=info
      # The host the sitemaps write their URLs against, matching what the web
      # app serves from.
      BASE_URL: https://bins.felixyeung.com
    depends_on:
      rewrite-db:
        condition: service_healthy
    labels:
      # /api/v2/* is served by the rewrite backend, /api is still next.js in
      # `web`. Priority sits above bins-rapid (20) and bins-api (15), which
      # would otherwise claim every /api path. The backend only knows /api, so
      # the version segment is rewritten away.
      - "traefik.http.routers.bins-api-v2.rule=HostRegexp(`.*`) && (Path(`/api/v2`) || PathPrefix(`/api/v2/`))"
      - "traefik.http.routers.bins-api-v2.priority=25"
      - "traefik.http.routers.bins-api-v2.middlewares=bins-api-v2-replace"
      - "traefik.http.middlewares.bins-api-v2-replace.replacepathregex.regex=^/api/v2"
      - "traefik.http.middlewares.bins-api-v2-replace.replacepathregex.replacement=/api"

  rewrite-sync-premises:
    build:
      context: ./backend
      target: cron
    image: bins-backend:cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@rewrite-db:5432/db
      SYNC_COMMAND: sync premises
      SCHEDULE: "0 4 * * *"
      RUST_LOG: backend=info
      TZ: Europe/London
    depends_on:
      rewrite-db:
        condition: service_healthy

  rewrite-sync-jobs:
    build:
      context: ./backend
      target: cron
    image: bins-backend:cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@rewrite-db:5432/db
      SYNC_COMMAND: sync jobs
      SCHEDULE: "0 4 * * *"
      RUST_LOG: backend=info
      TZ: Europe/London
    depends_on:
      rewrite-db:
        condition: service_healthy

  # Fills in coordinates for one postcode and its 100 nearest neighbours per run,
  # so this runs often rather than once a day: every 10 minutes between 2am and
  # 6am local time. The schedule is the one the node worker used.
  rewrite-sync-postcodes:
    build:
      context: ./backend
      target: cron
    image: bins-backend:cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@rewrite-db:5432/db
      SYNC_COMMAND: sync postcodes
      SCHEDULE: "*/10 * 2-5 * * *"
      RUST_LOG: backend=info
      TZ: Europe/London
    depends_on:
      rewrite-db:
        condition: service_healthy

secrets:
  tunnel_token:
    external: true
  rapid_api_proxy_secret:
    external: true

volumes:
  db-data:
  rewrite-db-data:
