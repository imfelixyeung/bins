services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked into the exported pages as their canonical origin. Nothing reads
        # the environment at runtime, since the site is served as static files.
        BASE_URL: https://bins.felixyeung.com
    image: bins-frontend:local
    restart: unless-stopped
    labels:
      # normal user rate limiting
      - "traefik.http.routers.bins.rule=HostRegexp(`.*`)"
      - "traefik.http.routers.bins.priority=10"
      - "traefik.http.routers.bins.middlewares=bins-ratelimit"
      # nginx listens on 8080, but its base image also exposes 80, and traefik
      # would otherwise take the lower of the two and find nothing listening.
      - "traefik.http.services.bins-frontend.loadbalancer.server.port=8080"

  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 30s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ./apps/backend
      target: runtime
    image: bins-backend:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db
      PORT: "3000"
      RUST_LOG: backend=info
      # The host the sitemaps write their URLs against, matching what the static
      # frontend was built with.
      BASE_URL: https://bins.felixyeung.com
    depends_on:
      db:
        condition: service_healthy
    labels:
      # Higher priority than the frontend router, so /api reaches this rather than
      # being looked for among the exported files. The frontend calls the API on
      # the same origin it is served from.
      - "traefik.http.routers.bins-api.rule=HostRegexp(`.*`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.bins-api.priority=25"
      - "traefik.http.routers.bins-api.middlewares=bins-ratelimit,bins-api-cors,bins-api-cache"

  sync-premises:
    build:
      context: ./apps/backend
      target: cron
    image: bins-backend:cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db
      SYNC_COMMAND: sync premises
      SCHEDULE: "0 4 * * *"
      RUST_LOG: backend=info
      TZ: Europe/London
    depends_on:
      db:
        condition: service_healthy

  sync-jobs:
    build:
      context: ./apps/backend
      target: cron
    image: bins-backend:cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db
      SYNC_COMMAND: sync jobs
      SCHEDULE: "0 4 * * *"
      RUST_LOG: backend=info
      TZ: Europe/London
    depends_on:
      db:
        condition: service_healthy

  # Fills in coordinates for one postcode and its 100 nearest neighbours per run,
  # so this runs often rather than once a day: every 10 minutes between 2am and
  # 6am local time. The schedule is the one the node worker used.
  sync-postcodes:
    build:
      context: ./apps/backend
      target: cron
    image: bins-backend:cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db
      SYNC_COMMAND: sync postcodes
      SCHEDULE: "*/10 * 2-5 * * *"
      RUST_LOG: backend=info
      TZ: Europe/London
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  proxy:
    image: traefik:v3.7.12
    command:
      - "--ping=true"
      - "--api.insecure=true"
      - "--providers.docker"
      - "--log.level=INFO"
    labels:
      - "traefik.http.middlewares.bins-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.bins-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.bins-ratelimit.ratelimit.period=10s"
      - "traefik.http.middlewares.bins-api-cors.headers.customresponseheaders.access-control-allow-origin=*"
      - "traefik.http.middlewares.bins-api-cache.headers.customresponseheaders.cache-control=public,max-age=60"
      - "traefik.http.middlewares.bins-api-cache-1s.headers.customresponseheaders.cache-control=public,max-age=1"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 30s
      retries: 15
      start_period: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db-data:
